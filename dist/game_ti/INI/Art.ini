;========================================================================================================
; 4. ANIMATION OVERLAYS
;========================================================================================================
; These are the temporary animation overlays that are used for such
; effects as explosions, smoke, and fire.

; Theater           = Is there theater specific art for this animation (def=no)?
; Normalized        = Should the animation speed be adjusted to appear consistent (def=no)?
; Scorch            = Does this animation leave small residual flames and scorch marks [e.g., napalm does this] (def=no)?
; Flamer            = Does this animation leave large residual flames [e.g., napalm] (def=no)?
; Crater            = Does this form a crater [e.g., artillery does this] (def=no)?
; Sticky            = Animation sticks to unit in square (def=no)?
; Surface           = Render this animation at ground layer (def=no)?
; Flat              = Is the animation flat on the ground [helps with drawing logic to know this] (def=no)?
; Translucent       = Is this animation translucent in appearence (def=no)?
; Translucency      = Percent of translucency to use [25, 50, 75% only] (def=none)
; Damage            = Damage to apply per minute to attached object [if any] (def=0)
; Rate              = How many animation frames to play in 30 seconds' time [on default in-game speed] (def=900)
;                     [i.e. Rate=30 => play 1 frame in 1 second]
; RandomRate        = Takes a min and max value (separated by comma) and picks the animation Rate from between the two values.
;                     Appears to increase the chance of desync in online multiplayer, so it's pretty much unused.
; Report            = Sound effect to play when this animation plays (def=none)
; Next              = Animation to spawn when this animation completes [fire uses this to get smaller over time] (def=none>
; Start             = [0-based index] Frame to start this animation from (def=first frame of animation)
; End               = [0-based index] Frame to end this animation on (def=last frame of animation)
; UseNormalLight    = Does this anim always draw at 10 brightness? (def=no)
; YSortAdjust       = Fudge to apply when sorting this object in it's layer (def=0).
; AltPalette        = Does it use an alternate drawing palette (def=no)?
; ShouldFogRemove   = Should this animation be removed by fog (def=yes)?
; TrailerAnim       = Animation to trail behind this animation, like smoke (def=none).
;                     Trailer animations are spawned continuously until the parent animation expires.
; TrailerSeperation = Delay, in frames, between every instance of TrailerAnim [e.g. how often to puff a smoke cloud] (def=1)
; 
;    These values are needed if the animation loops:
;
;    LoopCount   = Number of times this animation loops before ending (def=0)?
;    LoopStart   = [0-based index] Beginning frame of loop [if animation loops]
;    LoopEnd     = [1-based index] Last frame of loop [if animation loops] (def=last frame of animation)
;                  NOTE: if the animation has PingPong, then LoopEnd uses 0-based index

