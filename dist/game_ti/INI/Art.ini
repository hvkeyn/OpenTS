;The Nukes first-stage descending until impact
[NUKEDOWN]
Start=0
Rate=900
AltPalette=yes
NewTheater=no
UseNormalLight=no
YDrawOffset=-684

[GASBOMB]
Rate=900
UseNormalLight=yes

[APOCCLUS]
Rate=900
UseNormalLight=yes

;used to add a delay before the missile descends
;to make sure the fired missile has vanished before the descending missile appears and play a sireen
[NUKEINIT]
Image=CLRANIM
Start=0
End=3
Rate=10
Next=NUKESTRT
Report=SNUKSIRE

;start the missile anim and the explosion process
[NUKESTRT]
Image=CLRANIM
Start=0
End=2
Rate=900
Next=NUKEDOWN
TrailerAnim=NUKETMRS
TrailerSeperation=2

[NUKETMRS]
Image=CLRANIM	;necessary to make this work
Start=0
End=2
Rate=900
Next=NUKEXPTM
TrailerAnim=NUKEDBTM
TrailerSeperation=2

;Nuke Gas debris timer used to wait until the missile in the anim has reached the right position before starting the gas debris
[NUKEDBTM]
Image=CLRANIM	;necessary to make this work
Start=0
End=55
Rate=200
Next=NUKEGDBS

;Nuke explosion timer used to wait until the missile in the anim has hit the ground before starting the nuke explosion
[NUKEXPTM]
Image=CLRANIM	;necessary to make this work
Start=0
End=22
Rate=100
Next=NUKEEXPL

