;============================================================================
; SUPERPOWERS.INI - панель суперсил
;
; [Panel] перечисляет ВЕСЬ пул способностей игры (квадраты слева от радара).
; Из него панель сама выбирает набор для текущей миссии:
;
;  1) если в этом файле есть секция [Mission.<ИМЯ КАРТЫ>] - берётся её список,
;     например [Mission.GDI1A] со строками 0=ION, 1=PODS, ...;
;  2) иначе берутся способности, подходящие стороне игрока (Side=) и уже
;     открытые на этом этапе кампании (Tier= против номера миссии в её имени:
;     GDI1A -> 1, FSNOD04 -> 4, миссия без номера считается средней);
;  3) если стороне игрока не подошла ни одна способность (свои стороны в
;     кампаниях других игр), берётся начало пула, чтобы панель не пустовала.
;
; Способности, которые ухаживают за базой (Role=economy), в миссиях без единой
; своей постройки не выдаются: там им нечего ремонтировать.
;
; Дополнительно карта может донастроить набор своей секцией [SuperPowers]:
;   [SuperPowers]
;   0=ION          ; заменить/добавить способность из этого файла по имени секции
;   1=MY_ABILITY   ; или описать свою секцию прямо в карте
;
; Поля способности:
;   Name        - подпись под иконкой (русская)
;   Description - описание для подсказок
;   Type        - RECON | BARRAGE | DROP_PODS | ION_CANNON | MISSILE | CHEM_MISSILE |
;                 HUNTER_SEEKER | EM_PULSE | FIRESTORM | AIR_REINFORCE |
;                 UNIT_REINFORCE | TIBERIUM_SEED | ARMOR_BOOST
;   Weapon      - какое оружие игры выполняет удар (его эффект, голос и анимация):
;                 ION_CANNON | MULTI_MISSILE | CHEM_MISSILE | ... Если пусто - панель
;                 применяет свою версию удара (артобстрел, высадка, разведка и т.д.)
;   Cursor      - у какого оружия игры одолжить прицел выбора цели
;   Cameo       - иконка: SUPER:ION_CANNON | BUILDING:ИМЯ | UNIT:ИМЯ |
;                 INFANTRY:ИМЯ | AIRCRAFT:ИМЯ | SHP:ФАЙЛ.SHP
;   Side        - GDI | NOD | any
;   Tier        - 1..4, насколько поздно в кампании открывается (1 - с самого начала)
;   Charge      - время зарядки в секундах после применения
;   Count       - сколько раз можно применить за миссию
;   Units       - список юнитов/пехоты через запятую (для десанта и подкреплений)
;   Delivery    - Air | Underground | Orbital
;   Tiberium    - оставить тиберий после удара
;   Role        - support | assault | control | economy | recon
;
; Slots  - сколько квадратов показывать (не больше 6)
; TestAll - yes: тестовый режим, показывается весь пул без учёта стороны и миссии
;
; Ячейка стартует заряженной: первый вызов доступен сразу, а после применения
; начинается отсчёт зарядки. Пока идёт отсчёт, нажатие на ячейку ничего не делает.
;============================================================================

[Panel]
Slots=8
TestAll=no
0=RECON
1=NUKE
2=CHEM
3=HUNTER
4=EMP
5=MILITIA
6=BANSHEE
7=TUNNEL
8=ARTY
9=ION
10=MAMMOTH
11=BARRAGE
12=PODS
13=ORCA
14=APC
15=REPAIR
16=SEED

