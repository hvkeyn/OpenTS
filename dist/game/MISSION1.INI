;-------------------
; GDI BRIEFINGS
;-------------------

[FSGDI01.MAP]
Name=ГСБ 01: Возвращение Тацита
Briefing=FSGDI01

[FSGDI01]
1=Наш Кодиак разбился на пути к "Филадельфии".
2=Мы считаем, что он упал где-то в этом регионе.
3=На его борту был недавно обнаруженный нами Тацит.
4=Возглавьте небольшой отряд и найдите с его помощью
5=место крушение "Кодиака". Попытайтесь его починить,
6=а также помочь выжившим и найти ценный артефакт.
7=Будьте осторожны: в регионе были замечены силы
8=братства Нод и мутированные под влиянием тиберия
9=представители фауны. Кроме этого, над регионом
10=формируется ионная буря, из-за которой мы не
11=сможем использовать продвинутую технику.@
12=КОНЕЦ ПЕРЕДАЧИ.@@
13=Первое задание: Найдите Кодиак и попробуйте
14=его отремонтировать.@@
15=Второе задание: Найдите Тацит и верните его
16=в точку эвакуации.


[FSGDI02.MAP]
Name=ГСБ 02: Вечеринка с отродьями
Briefing=FSGDI02

[FSGDI02]
1=Мы потеряли связь с небольшим гражданским поселением
2=в этом регионе. Полученные от нашей близлежащей базы
3=сообщения свидетельствуют о вероятном нападении
4=мутированных форм жизни. Разведайте обстановку и
5=любой ценой защитите гражданских. Проведите как
6=можно больше гражданских лиц к нашим транспортам
7=для неотложной эвакуации.@
8=КОНЕЦ ПЕРЕДАЧИ.@@
9=Первое задание: Защитите небольшие гражданские
10=поселения и проведите жителей к транспортам.@@
11=Второе задание: Отбивайте нападения на базу
12=вплоть до прибытия подкреплений.


[FSGDI03.MAP]
Name=ГСБ 03: Подавление мятежа
Briefing=FSGDI03

[FSGDI03]
1=Из-за убийства Тратоса мутанты в наших колониях
2=организовали мятежи. Их главари считают, что мы
3=отравили местные запасы воды и продовольствий,
4=и поэтому пытаются их уничтожить. Эти действия
5=привели к обострению напряженности и началу
6=драк и перестрелок между гражданскими.@@
7=Возглавьте отряд и предотвратите беспорядки.
8=Избегайте потерь как среди гражданских, так
9=и среди мутантов. В вашем распоряжении пехота
10=с нелетальным вооружением. Кроме этого, вы
11=должны помешать уничтожению продовольственных
12=складов, так как они обеспечивают ресурсами
13=всех переселенцев в этом регионе.@
14=КОНЕЦ ПЕРЕДАЧИ.@@
15=Первое задание: Нейтрализируйте четырех главарей
16=мятежников, избегая жертв среди гражданских.@@
17=Второе задание: Предотвратите уничтожение
18=продовольственных складов.


[FSGDI04.MAP]
Name=ГСБ 04: В подарочной упаковке
Briefing=FSGDI04

[FSGDI04]
1=Мы считаем, что ядро СИНОДа находится в этом регионе.
2=Найдите и захватите его с помощью своего инженера.
3=Уничтожьте два моста, которые используются врагом
4=для отправки подкреплений. Для обороны ядра, силы
5=Нод установили лазерные ограждения с автономным  
6=питанием. Чтобы отключить ограждения, захватите
7=их станции управления - с этим вам помогут местные
8=технари. Проникнув на вражескую базу, уничтожьте
9=все защитные системы на страже ядра.@
10=КОНЕЦ ПЕРЕДАЧИ.@@
11=Первое задание: Уничтожьте два моста, по которым
12=передвигаются вражеские подкрепления.@@
13=Второе задание: Захватите ядро СИНОДа.


[FSGDI05.MAP]
Name=ГСБ 05: Полдень Догмы
Briefing=FSGDI05

[FSGDI05]
1=Поговаривают, что второй сегмент Тацита спрятан
2=внутри старинного храма вблизи города Ла-Пас в
3=Боливии. Один из наших археологов на пару с
4=Призраком поможет вам найти местоположение
5=храма и вернуть искомый нами артефакт.@
6=Мы также передаем под ваше управление нашу
7=новейшую разработку: Джаггернаут. Это
8=дальнобойная артиллерийская установка.
9=Будьте осторожны: этот регион неизведан.@
10=КОНЕЦ ПЕРЕДАЧИ.@@
11=Первое задание: Разведайте регион и найдите
12=старинный храм Тацита.@@
13=Второе задание: Достаньте Тацит из храма и
14=отправляйтесь в указанную точку эвакуации.


[FSGDI06.MAP]
Name=ГСБ 06: Побег от СИНОДа
Briefing=FSGDI06

[FSGDI06]
1=СИНОД нас предал. Силам ГСБ и, вероятно, всей
2=Земле, грозит уничтожение. Мы должны отступить и 
3=попытаться вызвать подкрепление. Спасение доктора
4=Будро - это ваша цель номер один. Проведите ее ко
5=взлетной площадке для эвакуации. Когда она будет
6=в безопасности, мы отправим к вам поддержку.@
7=КОНЕЦ ПЕРЕДАЧИ.@@
8=Первое задание: Проведите доктора Будро ко
9=взлетной площадке на территории блокпоста.@@
10=Второе задание: Укрепите блокпост, а затем
11=уничтожьте базу СИНОДа.


[FSGDI07.MAP]
Name=ГСБ 07: Наступление киборгов
Briefing=FSGDI07

[FSGDI07]
1=Мы потеряли связь с нашей базой вблизи города
2=Трондхейм. Разведайте зону и установите причину
3=тишины в радиоэфире. У нас нет данных о силах
4=СИНОДа в этом регионе, и нам очень необходима
5=хоть какая-то информация.@
6=КОНЕЦ ПЕРЕДАЧИ.@@
7=Первое задание: Предупредите гражданских об
8=угрозе, которую представляет СИНОД.@@
9=Второе задание: Постройте базу и уничтожьте
10=все силы СИНОДа.


[FSGDI08.MAP]
Name=ГСБ 08: Заводской отзыв
Briefing=FSGDI08

[FSGDI08]
1=Ученые ГСБ перепрограммировали киборга СИНОДа и
2=вживили в него вирус для уничтожения систем связи
3=обезумевшего компьютера. Проведите этого киборга
4=к защитному блокпосту СИНОДа и позаботьтесь о
5=том, чтобы он заразил систему связи. СИНОД
6=осведомлен о нашей операции и сделает все,
7=чтобы нам помешать. Постройте базу до того,
8=как он сможет укрепить свой блокпост.@
9=КОНЕЦ ПЕРЕДАЧИ.@@
10=Первое задание: Проведите зараженного киборга
11=в центр сетевой связи СИНОДа.@@
12=Второе задание: Уничтожьте вражеский завод
13=по производству киборгов.@
14=Третье задание: Уничтожьте оставшиеся силы
15=СИНОДа.


[FSGDI09.MAP]
Name=ГСБ 09: Ядреная проблема
Briefing=FSGDI09

[FSGDI09]
1=Нам удалось установить местоположение ядра
2=СИНОДа, и мы готовы начать наступление по
3=всем фронтам. Силы Нод нехотя согласились
4=временно прекратить огонь и помочь нам в
5=этой битве, атаковав СИНОДа одновременно
6=с нашими войсками. Уничтожение ядра СИНОДа
7=необходимо для завершения этой войны.@
8=КОНЕЦ ПЕРЕДАЧИ.@@
9=Первое задание: Постройте базу и отбейте
10=нападения сил СИНОДа.@@
11=Второе задание: Захватите 3 станции управления,
12=чтобы отключить лазерные ограждения и систему
13=защиты "Огненная буря".@@
14=Третье задание: Уничтожьте ядро СИНОДа.@


;-------------------
; NOD BRIEFINGS
;-------------------

[FSNOD01.MAP]
Name=НОД 01: Операция Перезагрузка
Briefing=FSNOD01

[FSNOD01]
1=Ученые ГСБ разобрали ядро СИНОДа на три части.
2=Братство Нод снова захлестнул хаос, и чтобы вновь
3=объединить братьев, нам необходимы умения СИНОДа.
4=Найдите и верните три части ядра СИНОДа, избегая
5=при этом обнаружения силами ГСБ. Под вашим
6=управлением лишь небольшой отряд, поэтому
7=вы должны оставаться в тени.@
8=КАНАЛ ПЕРЕДАЧИ ДАННЫХ ЗАКРЫТ.@@
9=Первое задание: Проникните на базу ГСБ.@@
10=Второе задание: Найдите три части ядра
11=СИНОДа.@@
12=Третье задание: Возвращайтесь в точку
13=первоначальной высадки для эвакуации.


[FSNOD02.MAP]
Name=НОД 02: Семена опустошения
Briefing=FSNOD02

[FSNOD02]
1=Первым шагом на пути к глобальному Озарению станет
2=оплодотворение земли с помощью новых тибериевых
3=форм жизни. Мы используем мутированных зверей для
4=того, чтобы преподать урок тем, кто пытается нас
5=остановить. Сначала вы должны отремонтировать
6=мост, который ведет к "Яме Бытия". Используйте
7=солдат с токсическими винтовками, чтобы "убедить"
8=гражданское население помочь нам с этой миссией.@
9=КАНАЛ ПЕРЕДАЧИ ДАННЫХ ЗАКРЫТ.@@
10=Первое задание: Избегайте обнаружения силами
11=ГСБ в этом регионе.@@
12=Второе задание: Используйте одурманенных гражданских
13=для выманивания тибериевых форм жизни из "Ямы Бытия"
14=и последующего уничтожения вражеских сил.


[FSNOD03.MAP]
Name=НОД 03: Последние часы Тратоса
Briefing=FSNOD03

[FSNOD03]
1=Пока силы ГСБ отвлечены безуспешными попытками
2=спасти гражданских, вы должны возглавить элитный
3=отряд с целью ликвидации вождя мутантов, Тратоса.
4=Наши новые дроны-ловушки помогут вам обнаружить
5=точное местоположение Тратоса на базе ГСБ. После
6=этого вам будет необходимо к нему подобраться.
7=ГСБ очень надежно охраняют мутанта, поскольку
8=он - это их последняя надежда остановить натиск
9=тиберия. Уничтожение их энергосистемы поможет
10=нейтрализировать систему "Огненная буря", а
11=точный удар с воздуха выведет из строя их
12=датчики обнаружения.@@
13=Не подведите меня: эта миссия имеет критическое
14=значение для будущего всего братства Нод.@
15=КАНАЛ ПЕРЕДАЧИ ДАННЫХ ЗАКРЫТ.@@
16=Первое задание: Прикрепите дроны-ловушки к
17=технике ГСБ, чтобы обнаружить Тратоса.@@
18=Второе задание: Отключите "Огненную бурю" и
19=нейтрализируйте датчики обнаружения.@@
20=Третье задание: Убейте Тратоса.


[FSNOD04.MAP]
Name=НОД 04: Истребление мутантов
Briefing=FSNOD04

[FSNOD04]
1=Мутированные отродья вновь напоминают о своем жалком
2=существовании. Они украли Тацит, над возвращением
3=которого я... мы все так усердно работали. Чтобы
4=воплотить план Кэйна в реальность, мы должны вернуть
5=Тацит, а когда это будет сделано, нам придется
6=истребить остатки мутантов в этом регионе. Возможно,
7=это наглядно продемонстрирует этим зверям, что лезть
8=в дела братства Нод - дело гиблое.@
9=КАНАЛ ПЕРЕДАЧИ ДАННЫХ ЗАКРЫТ.@@
10=Первое задание: Найдите лагерь мутантов.@@
11=Второе задание: Отберите Тацит и доставьте его
12=в точку эвакуации.@@
13=Третье задание: Уничтожьте остатки сил мутантов.


[FSNOD05.MAP]
Name=НОД 05: Побег от СИНОДа
Briefing=FSNOD05

[FSNOD05]
1=СИНОД нас предал. Мы должны отступить и перегруппироваться,
2=чтобы отплатить ему за это предательство. Рядом есть старый
3=аэродром. Если мы сможем до него добраться, у нас появится
4=шанс. Оказавшись на аэродроме, мы должны отремонтировать
5=радар и связаться со штабом, чтобы запросить неотложную
6=эвакуацию. Из-за предательства СИНОДа мы потеряли связь
7=со всеми своими силами и не имеем данных о ситуации.@
8=КАНАЛ ПЕРЕДАЧИ ДАННЫХ ЗАКРЫТ.@@
9=Первое задание: Бегите от сил СИНОДа и отступайте
10=к заброшенному аэродрому.@@
11=Второе задание: Отремонтируйте радар и запросите
12=немедленную эвакуацию.@@
13=Третье задание: Отступайте к Монтоку.


[FSNOD06.MAP]
Name=НОД 06: Нужды большинства!
Briefing=FSNOD06

[FSNOD06]
1=Из-за предательства СИНОДа мы оказались без средств
2=связи и в полной изоляции. Мы вынуждены предпринять
3=попытку кражи модуля ЭВА ГСБ. В этом регионе находится
4=небольшая воздушная база. Отправьте своего инженера
5=в их радар, чтобы украсть компьютер ГСБ. Вы должны
6=каким-то образом отвлечь воздушные силы врага, чтобы
7=беспрепятственно совершить задуманное.@@
8=В вашем распоряжении новое подразделение: мобильный
9=стелс-генератор. Используйте его с умом.@
10=КАНАЛ ПЕРЕДАЧИ ДАННЫХ ЗАКРЫТ.@@
11=Первое задание: Разведайте зону и найдите базу ГСБ,
12=а также гражданские поселения.@@
13=Второе задание: Отвлеките воздушные силы ГСБ,
14=устроив диверсию.@@
15=Третье задание: Отправьте инженера в центр
16=связи ГСБ, чтобы украсть модуль ЭВЫ.


[FSNOD07.MAP]
Name=НОД 07: Решительное воздаяние
Briefing=FSNOD07

[FSNOD07]
1=Выжженная земля, командир. Не больше, не меньше.
2=Уничтожьте все кибернетические подразделения в
3=этом регионе. База СИНОДа защищена лазерными
4=ограждениями, как и само ядро предателя.@
5=КАНАЛ ПЕРЕДАЧИ ДАННЫХ ЗАКРЫТ.@@
6=Первое задание: Отремонтируйте мосты для получения
7=подкреплений.@@
8=Второе задание: Захватите станции управления, чтобы
9=отключить лазерные ограждения вокруг ядра СИНОДа.@@
10=Третье задание: Уничтожьте базу и все силы СИНОДа.


[FSNOD08.MAP]
Name=НОД 08: Охота на комбайны
Briefing=FSNOD08

[FSNOD08]
1=Прежде чем начать наступление на базу СИНОДа, мы
2=должны замедлить его производственные процессы.
3=СИНОД активно собирает тиберий в восточной Африке.
4=Отправляйтесь туда и уничтожьте все обогатители.
5=Наши силы еще не до конца мобилизированы, поэтому
6=в вашем распоряжении будет лишь небольшой
7=штурмовой отряд.@@
8=Используйте новый Кулак Нод для постройки техники
9=непосредственно на поле боя. Найдите вражеские
10=обогатители, комбайны и хранилища - и испепелите их.@
11=КАНАЛ ПЕРЕДАЧИ ДАННЫХ ЗАКРЫТ.@@
12=Первое задание: Защитите гражданское поселение
13=от нападения сил СИНОДа.@@
14=Второе задание: Уничтожьте обогатители,
15=комбайны и хранилища тиберия СИНОДа.


[FSNOD09.MAP]
Name=НОД 09: Ядреная проблема
Briefing=FSNOD09

[FSNOD09]
1=Вот и пришло время! Ликвидируйте СИНОДа молниеносным
2=ударом, без промедления и без сожаления. Найдите способ
3=прорвать его периметр и уничтожьте его ядро. Силы ГСБ
4=заняты отвлечением СИНОДа, и это дает нам отличную
5=возможность поставить жирную точку в этой войне.@
6=КАНАЛ ПЕРЕДАЧИ ДАННЫХ ЗАКРЫТ.@@
7=Первое задание: Постройте базу и отбейте нападения
8=отрядов СИНОДа.@@
9=Второе задание: Захватите 3 станции управления, чтобы
10=отключить лазерные ограждения и систему "Огненная буря",
11=которые защищают ядро СИНОДа.@@
12=Третье задание: Уничтожьте ядро СИНОДа.

