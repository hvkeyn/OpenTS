[TEST01.MAP]
Name=Полигон 1: силы ГСБ
Briefing=TEST01

[TEST01]
1=Это испытательный полигон, а не боевое задание.
2=Все восемь способностей выданы сразу и заряжены с начала боя.
3=Проверьте по порядку:
4=Разведку - снимает туман с района.
5=Десант в капсулах и налёт "Орка" - пехота и самолёты.
6=Подкрепление БТР и шагоходы - техника на поле.
7=Залп РСЗО - несколько снарядов по площади.
8=Ионный удар - самый мощный удар, один раз за бой.
9=Ремонт построек - восстановление своих зданий.
