; GDI Mission 1A
[GDI1A.MAP]
Name=Оборона базы Феникс
Briefing=GDI1A
VoiceOver=GDI-01.AUD

[GDI1A]
1=Полученные нами от сил ГСБ запросы о поддержке свидетельствуют о том,
2=что на нашу базу "Феникс" в этом регионе было совершено нападение. Мы
3=должны отстроить эту базу, соорудив казарму и обогатитель.
4=Восстановив боеспособность базы, уничтожьте все силы Нод.@@
5=Первое задание: Постройте обогатитель.@@
6=Второе задание: Постройте казарму.@@
7=Третье задание: Уничтожьте все силы Нод.


; GDI Mission 2A
[GDI2A.MAP]
Name=Обеспечение безопасности региона
Briefing=GDI2A
VoiceOver=GDI-02.AUD

[GDI2A]
1=Напавшие на нашу базу "Феникс" силы Нод отступили к базе братства Нод в
2=этом регионе. Полученные от командования ГСБ приказы велят вам уничтожить
3=вражескую базу, однако в непосредственной близости от нее находится
4=гражданское поселение. Мы обязаны спасти гражданских прежде, чем начнется
5=полномасштабное наступление. Чтобы наши транспорты "Касатка" смогли забрать
6=людей, мы должны уничтожить установки ПВО Нод. После эвакуации гражданских,
7=приступайте к ликвидации базы братства.@@
8=Первое задание: Разверните МСЦ и приступайте к постройке базы.@@
9=Второе задание: Уничтожьте все установки ПВО Нод.@@
10=Третье задание: Уничтожьте базу Нод.


; GDI Mission 3A
[GDI3A.MAP]
Name=Захват места крушения
Briefing=GDI3A
VoiceOver=GDI-03A.AUD

[GDI3A]
1=Силы ГСБ в этом регионе сообщают об обнаружении неизвестного летательного
2=аппарата, который потерпел крушение. Ноды очень заинтересовались этим
3=аппаратом, а соответственно он интересует и нас. Найдите место крушения
4=и захватите все технологические центры Нод, чтобы установить природу
5=разбившегося объекта.@@
6=Первое задание: Найдите место крушения.@@
7=Второе задание: Захватите технологические центры Нод.


; GDI Mission 3B
[GDI3B.MAP]
Name=Захват железнодорожной станции
Briefing=GDI3B
VoiceOver=GDI-03B.AUD

[GDI3B]
1=Силы Нод разместили свою вспомогательную базу рядом с гражданской
2=железнодорожной станцией. Мы можем воспользоваться поездом и путями,
3=чтобы напасть на восточную базу Нод. Избегайте обнаружения патрулями и
4=уничтожьте все постройки Нод в регионе. После этого, захватите станцию
5=с помощью инженера. НЕ УНИЧТОЖАЙТЕ ни станцию, ни сам поезд, так как они
6=являются важными элементами нашего плана. Дополнительные инженеры и
7=другие подразделения доступны, но не бесконечны. Будьте внимательны.@@
8=Первое задание: Уничтожьте все постройки Нод.@@
9=Второе задание: Захватите железнодорожную станцию.


; GDI Mission 4A
[GDI4A.MAP]
Name=Оборона места крушения
Briefing=GDI4A
VoiceOver=GDI-04.AUD

[GDI4A]
1=Что бы ни было на борту этого НЛО, силы Нод очень не хотят, чтобы оно попало
2=в руки ГСБ. Защищайте место крушения корабля вплоть до прибытия дополнительных
3=сил ГСБ, которые помогут вам обезопасить этот регион.@@
4=Первое задание: Удерживайте место крушения до прибытия подкреплений.@@
5=Второе задание: Не позвольте силам Нод уничтожить НЛО.


; GDI Mission 5A
[GDI5A.MAP]
Name=Уничтожение радарных массивов
Briefing=GDI5A
VoiceOver=GDI-05A.AUD

[GDI5A]
1=Уничтожьте три ретрансляционные станции и радарный массив, чтобы вырубить
2=сеть датчиков Нод. Это облегчит операцию по спасению Тратоса, так как Ноды
3=не смогут обнаружить вас сразу же по появлению в регионе.@@
4=Первое задание: Уничтожьте три ретрансляционные станции.@@
5=Второе задание: Уничтожьте радарный массив.


; GDI Mission 5B
[GDI5B.MAP]
Name=Спасение Тратоса
Briefing=GDI5B
VoiceOver=GDI-05B.AUD

[GDI5B]
1=Ноды проводят эксперименты на выживших мутантах на территории тюремного
2=комплекса. Среди узников и Тратос, вождь всех мутантов. Освободите Тратоса
3=с помощью спецотряда Умагон, а потом проведите его в точку эвакуации. Как
4=только Тратос будет в безопасности, используйте подкрепления ГСБ для
5=уничтожения базы и тюремного комплекса Нод.@@
6=Первое задание: Спасите Тратоса из тюрьмы.@@
7=Второе задание: Проведите Тратоса в точку эвакуации.@@
8=Третье задание: Уничтожьте базу и тюремный комплекс Нод.


; GDI Mission 5C
[GDI5C.MAP]
Name=Спасение Тратоса
Briefing=GDI5B
VoiceOver=GDI-05B.AUD


; GDI Mission 6A
[GDI6A.MAP]
Name=Уничтожение дамбы Веги
Briefing=GDI6A
VoiceOver=GDI-06A.AUD

[GDI6A]
1=Гидроэлектрическая дамба в этом районе обеспечивает островную крепость Веги
2=практически безграничной энергией. Уничтожение этой дамбы нанесет защитным
3=системам Веги серьезный ущерб, позволив ГСБ развернуть более существенные
4=силы с целью уничтожения его базы.@@
5=Дамба очень хорошо охраняется, поэтому нападать напрямик - глупая затея. 
6=Как сообщает разведка, вместо этого следует попытаться уничтожить две
7=регуляторные станции, без которых дамбе угрожает критическая перегрузка,
8=а впоследствии - и самоликвидация.@@
9=Первое задание: Уничтожьте дамбу любым доступным способом.


; GDI Mission 6B
[GDI6B.MAP]
Name=Уничтожение базы Веги
Briefing=GDI6B
VoiceOver=GDI-06B.AUD

[GDI6B]
1=В этом регионе находится главная база Веги. Ее надежно прикрывают установки
2=ПВО, а из соседнего блокпоста поступают подкрепления. Уничтожьте все силы
3=Нод в зоне операции, но не трогайте пирамиду Веги, так как мы располагаем
4=информацией о том, что сам генерал может находиться внутри. До уничтожения
5=установок ПВО количество сил в вашем распоряжении будет ограничено.@@
6=Первое задание: Уничтожьте базу Нод.@@
7=Второе задание: Захватите пирамиду Веги.


; GDI Mission 7A
[GDI7A.MAP]
Name=Захват базы Хаммерфест
Briefing=GDI7A
VoiceOver=GDI-07.AUD

[GDI7A]
1=Войска Нод захватили базу Хаммерфест. Ее периметр охраняется системой
2="Огненная буря", поэтому вам придется найти другой путь на территорию
3=комплекса. Используйте для этого РСЗО и передвигайтесь морскими путями.
4=Проникнете на базу ГСБ и возьмите ее под контроль. Когда база вновь
5=окажется в наших руках, уничтожьте все силы Нод в регионе.@@
6=Первое задание: Проникнете на захваченную базу ГСБ.@@
7=Второе задание: Верните ее под свой контроль с помощью инженеров.@@
8=Третье задание: Уничтожьте все силы Нод в регионе.


; GDI Mission 8A
[GDI8A.MAP]
Name=Возвращение кристаллов Разрушителя
Briefing=GDI8A
VoiceOver=GDI-08.AUD

[GDI8A]
1=Вы должны любой ценой остановить поезд Нод, который двигается на их
2=базу в этом регионе. Недавнее таяние льда привело к повреждению единственного
3=железнодорожного моста. Инженеры Нод уже отправились к мосту, чтобы его
4=отремонтировать, поэтому действовать придется быстро. Если вы сможете
5=пробраться к поезду до того, как мост будет отремонтирован, кристаллы
6=можно будет вернуть без каких-либо проблем. В противном случае, вам
7=придется напасть на саму базу Нод. Не забывайте, что уничтожив локомотив,
8=вы сможете остановить поезд, но кристаллы вы найдете в одном из вагонов.@@
9=Первое задание: Найдите поезд и уничтожьте локомотив до того, как
10=инженеры отремонтируют мост. Кристаллы будут в одном из вагонов.@@
11=Второе задание: Если инженеры отремонтируют мост и поезд доедет до
12=базы Нод, найдите и уничтожьте саму базу, а затем - верните
13=украденные кристаллы.


; GDI Mission 9A
[GDI9A.MAP]
Name=Спасение заключенных
Briefing=GDI9A
VoiceOver=GDI-09A.AUD

[GDI9A]
1=Умагон просит помочь ей с освобождением заключенных в тюрьме Нод мутантов.
2=Сама тюрьма находится на острове на востоке. Ноды располагают большим
3=военным контингентом, как в городе, так и на нескольких блокпостах. Наши же
4=ресурсы ограничены, а возможности получать подкрепления также не будет,
5=поэтому избегайте обнаружения. В этом регионе ожидает отряд самой Умагон, и
6=если вы с ним свяжитесь, они попытаются вам помочь. Продвигайтесь к тюрьме и
7=освободите узников. Когда тюрьма окажется под вашим контролем, мы отправим
8=транспорты, чтобы подобрать людей Умагон. Тюрьму могут прикрывать установки
9=ПВО, которые будет необходимо уничтожить.@@
10=Первое задание: Найдите тюрьму Нод.@@
11=Второе задание: Освободите и эвакуируйте заключенных мутантов.


; GDI Mission 9B
[GDI9B.MAP]
Name=Уничтожение запасов химикатов
Briefing=GDI9B
VoiceOver=GDI-09B.AUD

[GDI9B]
1=Эта станция химического снабжения обеспечивает исследовательские центры Нод
2=огромным количеством тибериевых токсинов. Ее уничтожение нанесет сокрушительный
3=удар по исследованиям братства, а также не позволит подкреплениям с этой базы
4=поддерживать остальные укрепления в регионе.@@
5=Разведчики советуют быть предельно осторожными вблизи от цистерн с химикатами,
6=так как содержащиеся внутри токсины весьма коррозийны и представляют
7=смертельную угрозу как для пехоты, так и для техники.@@
8=Первое задание: Найдите хорошее место для базы.
9=Второе задание: Уничтожьте химический комплекс Нод.


; GDI Mission 9C
[GDI9C.MAP]
Name=Подрыв системы энергообеспечения
Briefing=GDI9C
VoiceOver=GDI-09C.AUD

[GDI9C]
1=Чтобы облегчить нападение на ракетный комплекс Нод, мутанты должны установить
2=взрывчатку под каждой из 6 энергостанций. Энергосистема хорошо защищена, но
3=поезд позволит нашему отряду проехать через пункт охраны и ворота, избежав
4=поднятия тревоги. Если же силы Нод обнаружат наш спецотряд, взорвите
5=электростанции любым доступным вам способом.@@
6=Первое задание: Установите взрывчатку под каждой из 6 электростанций.


; GDI Mission 9D
[GDI9D.MAP]
Name=Уничтожение ракетного комплекса
Briefing=GDI9D
VoiceOver=GDI-09D.AUD

[GDI9D]
1=В этом районе находится главный ракетно-химический завод Нод. Именно благодаря
2=этому заводу братству удалось добиться максимального заражения региона тиберием,
3=с последующими мутациями флоры и фауны. Уничтожение завода не позволит ученым
4=Нод далее проводить эксперименты по заражению природы нашей планеты.@@
5=Первое задание: Уничтожьте ракетные шахты Нод.@@
6=Второе задание: Уничтожьте все силы Нод.


; GDI Mission 10A
[GDI10A.MAP]
Name=Уничтожение завода по производству прототипов
Briefing=GDI10A
VoiceOver=GDI-10A.AUD

[GDI10A]
1=Это - одно из двух возможных местоположений завода по производству прототипов. Определите
2=точную позицию завода с помощью мутантов, избегая при этом обнаружения силами неприятеля.
3=Если Ноды заподозрят присутствие наших отрядов, они тот час же спрячут завод под
4=стелс-полем, а на перехват будут отправлены подкрепления. Помогите мутантам спрятаться,
5=и Ноды отключат стелс-генератор, посчитав регион зачищенным. Когда мы установим координаты
6=базы братства, к вам будут отправлены транспорты ГСБ с войсками для зачистки зоны.@@
7=Первое задание: Определите местоположение завода Нод, используя мутантов.@@
8=Второе задание: Когда завод будет обнаружен, прибудут подкрепления для строительства
9=базы. Подготовьте армию и уничтожьте завод по производству прототипов.


; GDI Mission 10B
[GDI10B.MAP]
Name=Уничтожение завода по производству прототипов
Briefing=GDI10B
VoiceOver=GDI-10B.AUD

[GDI10B]
1=Это - еще одно возможное местоположение завода по производству прототипов. Определите
2=точную позицию завода с помощью мутантов, избегая при этом обнаружения силами неприятеля.
3=Если Ноды заподозрят присутствие наших отрядов, они тот час же спрячут завод под
4=стелс-полем, а на перехват будут отправлены подкрепления. Помогите мутантам спрятаться,
5=и Ноды отключат стелс-генератор, посчитав регион зачищенным. Когда мы установим координаты
6=базы братства, к вам будут отправлены транспорты ГСБ с войсками для зачистки зоны.@@
7=Первое задание: Определите местоположение завода Нод, используя мутантов.@@
8=Второе задание: Когда завод будет обнаружен, прибудут подкрепления для строительства
9=базы. Подготовьте армию и уничтожьте завод по производству прототипов.


; GDI Mission 11A
[GDI11A.MAP]
Name=Переждать бурю
Briefing=GDI11A
VoiceOver=GDI-11.AUD

[GDI11A]
1=ВНИМАНИЕ: Кэйн намерен вас убить. Ему известно о том, что Кодиак не может
2=подняться в воздух, и именно поэтому он решил напасть без промедления. Защищайте
3=Кодиак, пока буря не утихнет. Ионные частицы будут мешать работе вашего
4=оборудования, поэтому будьте готовы к неисправностям.@@
5=Первое задание: Любой ценой защитите Кодиак.@@
6=Второе задание: Уничтожьте все силы Нод.


; GDI Mission 12A
[GDI12A.MAP]
Name=Последний бой
Briefing=GDI12A
VoiceOver=GDI-12.AUD

[GDI12A]
1=Полученные в ходе сканирования исходящих из Каира импульсов данные подтверждают,
2=что в течение следующих часов Кэйн намерен запустить свою ракету, которая изменит
3=мир. Уничтожьте его храм-шахту до того, как это произойдет. Иных вариантов нет.@@
4=Первое задание: Зачистите зону для прибытия транспорта с МСЦ.@@
5=Второе задание: Уничтожьте установки МБР.@@
6=Третье задание: Уничтожьте храм-пирамиду.@@
7=Четвертое задание: Уничтожьте все силы Нод.


;============================================================================
; Nod MISSIONS
;============================================================================

; Nod Mission 1A
[NOD1A.MAP]
Name=Возвращение пророка
Briefing=NOD1A
VoiceOver=NOD-01.AUD

[NOD1A]
1=Хассан намерен остановить нас любой ценой. Его гвардия преследует наши силы,
2=которые отступают к небольшой базе рядом с его штабом. Мы должны отразить
3=его наступление и построить обогатитель, чтобы восстановить производство
4=и получить возможность нанести ему ответный удар.@@
5=Первое задание: Постройте обогатитель.@@
6=Второе задание: Уничтожьте элитную гвардию Хассана.

; Nod Mission 2A
[NOD2A.MAP]
Name=Возмездие
Briefing=NOD2A
VoiceOver=NOD-02.AUD

[NOD2A]
1=Хассан использует телевизионную станцию в этом регионе для распространения
2=своей пропаганды. Пока братство разобщено, у нас есть отличная возможность
3=отрезать Хассана от его последователей. Захватите телевизионную станцию, и
4=те, кто когда-то поклялся в верности технологии мира Кэйна вспомнят про
5=свою клятву. А что касается жалкой гвардии Хассана - уничтожьте их.@@
6=Первое задание: Захватите телевизионную станцию на востоке.@@
7=Второе задание: Уничтожьте элитную гвардию Хассана.


; Nod Mission 3A
[NOD3A.MAP]
Name=Уничтожение храма Хассана
Briefing=NOD3A
VoiceOver=NOD-03A.AUD

[NOD3A]
1=Мы проследили путь неверного Хассана к этому региону Каира. Постройте
2=свою базу и убейте лже-фараона, который метит на трон Кэйна.@@
3=Первое задание: Перейдите через мост и уничтожьте врагов на дальней стороне.@@
4=Второе задание: Разверните МСЦ и начните постройку базы.@@
5=Третье задание: Найдите и уничтожьте храм Хассана.


; Nod Mission 3B
[NOD3B.MAP]
Name=Освобождение пленного командира
Briefing=NOD3B
VoiceOver=NOD-03B.AUD

[NOD3B]
1=Нам сообщают о том, что в данном регионе в заточении находится командир, который
2=когда-то служил Хассану. Освободите его людей и самого командира, и вполне
3=вероятно, что они проникнутся нашими идеалами, и захотят помочь с захватом
4=предателя. Кроме этого, пленный командир может владеть информацией,
5=завладев которой мне... вам будет намного легче осуществить задуманное.@@
6=Первое задание: Найдите и освободите пленного командира.


; Nod Mission 4A
[NOD4A.MAP]
Name=Извещение о выселении
Briefing=NOD4A
VoiceOver=NOD-04.AUD

[NOD4A]
1=ГСБ взяли под контроль священную землю, на которой возвышается наш храм. Ваша
2=цель легка: найдите храм и ликвидируйте нарушителей. Они не ожидают появления
3=сил Нод, поэтому элемент неожиданности на вашей стороне. Сам храм - и вся в
4=нем информация - должны остаться невредимыми. Одно дело, одна цель!@@
5=Первое задание: Найдите старый храм Нод.@@
6=Второе задание: Уничтожьте все силы ГСБ.


; Nod Mission 4B
[NOD4B.MAP]
Name=Отключение энергии
Briefing=NOD4B
VoiceOver=NOD-04.AUD

[NOD4B]
1=Уничтожение этой практически не обороняемой позиции ГСБ позволит нам с лёгкостью
2=вновь получить контроль над нашим храмом в Сараево. Продвигайтесь под прикрытием
3=ионного шторма, пока системы связи ГСБ будут отключены. Уничтожьте вражеский центр
4=связи - и мы сможем подобраться к храму в Сараево намного ближе.@@
5=Первое задание: Найдите и уничтожьте центр связи ГСБ до того, как буря утихнет.


; Nod Mission 5A
[NOD5A.MAP]
Name=Спасение и перехват
Briefing=NOD5A
VoiceOver=NOD-05.AUD

[NOD5A]
1=Где-то в этом регионе разбился корабль пришельцев. НАЙДИТЕ ЕГО! Вокруг полно сил
2=ГСБ, поэтому вам следует действовать очень тихо. Когда вы найдете корабль,
3=отправьте внутрь инженера, чтобы тот достал Тацит. Если вам не повезет
4=встретится с войсками Веги... их потери никого волновать не будут.@@
5=Первое задание: Найдите место крушения НЛО и верните артефакт Кэйна.@@
6=Второе задание: Любой ценой предотвратите перемещение Тацита.


; Nod Mission 6A
[NOD6A.MAP]
Name=В овечьей шкуре
Briefing=NOD6A
VoiceOver=NOD-06A.AUD

[NOD6A]
1=Мы вот-вот получим полный контроль над мутантами. Их штаб-квартира находится на
2=север от места вашей высадки. На юго-западе вы встретите небольшую базу ГСБ.
3=Возьмите ее под свое управление и используйте их технику и знамена, дабы все
4=свидетели не имели сомнений: в преступном убийстве мутантов виноваты именно
5=эти неудачники и их предводитель - генерал Соломон.@@
6=Первое задание: Захватите вражеский строительный цех.@@
7=Второе задание: Уничтожьте мутантов, используя подразделения ГСБ.


; Nod Mission 6B
[NOD6B.MAP]
Name=Захват Умагон
Briefing=NOD6B
VoiceOver=NOD-06B.AUD

[NOD6B]
1=Вы должны добраться до медицинской колонии, избежав обнаружения силами ГСБ. Увидев
2=противника, эти трусы начнут эвакуацию всей базы. Чтобы этого избежать, советую
3=уничтожить три установки с датчиками, которые передают данные в их центр. К нам на
4=службу как раз поступили новые артиллерийские подразделения, и даже в ваших руках
5=они должны прекрасно себя проявить. Когда ваши войска окажутся на базе ГСБ,
6=захватить мутантку сможет даже ребенок.@@
7=Первое задание: Найдите и уничтожьте радарные датчики ГСБ, избежав при этом
8=обнаружения их войсками.@@
9=Второе задание: Уничтожив датчики, захватите медицинскую колонию прежде, чем
10=мутантка Умагон сможет сбежать из региона.


; Nod Mission 6C
[NOD6C.MAP]
Name=Захват Умагон
Briefing=NOD6C
VoiceOver=NOD-06C.AUD

[NOD6C]
1=Есть вероятность того, что мутантка попытается сбежать, используя систему
2=подземного сообщения в Новом Детройте. Захватите железнодорожную станцию до
3=ее прибытия. Если она сядет на поезд, вам придется немедленно его остановить,
4=иначе иной возможности захватить эту дрянь у нас может и не появиться.@@
5=Первое задание: Найдите и захватите железнодорожную станцию до того, как
6=Умагон прилетит и попытается сесть на поезд для побега из региона.@
7=Второе задание: Если Умагон сядет на поезд до того, как вы захватите станцию,
8=остановите поезд, уничтожив локомотив. Это нужно сделать прежде, чем Умагон
9=сбежит из региона.


; Nod Mission 7A
[NOD7A.MAP]
Name=Уничтожение исследовательского комплекса ГСБ
Briefing=NOD7A
VoiceOver=NOD-07A.AUD

[NOD7A]
1=Вы должны уничтожить исследовательский комплекс ГСБ в этом регионе до того,
2=как ученые ГСБ усовершенствуют свою технологию снижения воздействия тиберия.
3=Прежде, чем силы Нод смогут закрепиться в регионе, следует ликвидировать
4=патрули ГСБ. С этим нам могут помочь местные мутанты.@@
5=Первое задание: Свяжитесь с мутантами.@@
6=Второе задание: Возьмите под контроль туннель и главную дорогу.@@
7=Третье задание: Найдите исследовательский комплекс ГСБ.@
8=Четвертое задание: Уничтожьте исследовательский комплекс.


; Nod Mission 7B
[NOD7B.MAP]
Name=Сопровождение грузовиков с био-токсинами
Briefing=NOD7B
VoiceOver=NOD-07B.AUD

[NOD7B]
1=Недавно силам ГСБ удалось выбить наши войска из этого региона. Однако наши шпионы
2=сообщают, что ГСБ еще не уничтожили наш завод по очистке сорняков. Киборгу-коммандосу
3=и его спецотряду удалось пробраться через блокпосты ГСБ. С вашей помощью, они смогут
4=спасти два грузовика с биологическими токсинами, но действовать нужно быстро.@@
5=Первое задание: Найдите грузовики с био-токсинами.@@
6=Второе задание: Сопроводите грузовики к северному блокпосту.


; Nod Mission 8A
[NOD8A.MAP]
Name=Негодяйка в беде
Briefing=NOD8A
VoiceOver=NOD-08.AUD

[NOD8A]
1=Я отправил вам на помощь киборга-коммандоса. Как только он вас освободит,
2=отправляйтесь на юг - там вас будет ждать спасательный отряд. С его помощью,
3=вам предстоит найти и освободить Оксану - и сделать это придется без
4=промедления, иначе силы ГСБ переведут ее на территорию главной базы. 
5=Освободив Оксану, украдите один из вражеских транспортников и
6=возвращайтесь в штаб.@@
7=Первое задание: Найдите и освободите Оксану.@@
8=Второе задание: Украдите транспорт ГСБ и используйте его для побега.


; Nod Mission 9A
[NOD9A.MAP]
Name=Укрепление региона
Briefing=NOD9A
VoiceOver=NOD-09A.AUD

[NOD9A]
1=В этом регионе находится старая база Нод, на территории которой во всю цветет
2=и пахнет тибериевая флора и фауна. Найдите базу, восстановите производство -
3=и используйте тибериевую фауну для зарядки нашей ракеты. Когда соберете достаточное
4=количество субстанции, запустите ракету по базе ГСБ и сотрите их с лица земли.@@
5=Первое задание: Найдите и возьмите под контроль нашу старую базу.@@
6=Второе задание: Уничтожьте базу ГСБ.


; Nod Mission 9B
[NOD9B.MAP]
Name=Защита конвоев с сорняками
Briefing=NOD9B
VoiceOver=NOD-09B.AUD

[NOD9B]
1=Проходящая через этот сектор дорога - важнейшее звено снабжения. Если мы сможем
2=закрепиться на этой позиции и построить завод по очистке сорняков, наша армия
3=сможет запускать отсюда тибериевые ракеты. В этом регионе находится база ГСБ,
4=которая никак не защищена от ракетных атак. Как только ваша ракета будет готова,
5=уничтожить этих олухов будет проще простого.@@
6=Первое задание: Постройте базу и соорудите завод по очистке сорняков.@@
7=Второе задание: Уничтожьте базу ГСБ.


; Nod Mission 10A
[NOD10A.MAP]
Name=Уничтожение Мамонта II серии
Briefing=NOD10A
VoiceOver=NOD-10.AUD

[NOD10A]
1=Силы ГСБ собираются испробовать новый прототип танка "Мамонт" второй серии.
2=Мы должны как можно скорее подорвать производство этого технологического
3=чудовища. Но прежде, чем мы сможем нанести удар, нам необходимо установить,
4=где именно его испытывают. Отправьте шпиона-хамелеона в один из их центров
5=связи. Как правило, такую информацию ГСБ хранят внутри. Опасайтесь патрулей -
6=шпион в нашем распоряжении только один. Когда мы обнаружим испытательную
7=площадку, постройте свою базу и уничтожьте прототип. С этого момента у вас
8=есть доступ к смертоносным истребителям класса "Банши". Что делать с самой
9=базой ГСБ - вам решать, но прототип "Мамонта" ДОЛЖЕН быть уничтожен.@@
10=Первое задание: Отправьте шпиона в центр связи ГСБ.@@
11=Второе задание: Уничтожьте прототип танка "Мамонт" второй серии.


; Nod Mission 11A
[NOD11A.MAP]
Name=Захват Джейка Макнила
Briefing=NOD11A
VoiceOver=NOD-11.AUD

[NOD11A]
1=Брат одного из командиров ГСБ, Джейк Макнил, возглавляет команду проверки, которая
2=должна проинспектировать небольшую базу в этом регионе. Он достаточно осведомлен
3=о действиях ГСБ, и эти знания будут для нас бесценными. Захватите базу с помощью
4=инженеров и дождитесь прибытия Джейка и его команды. По сигналу, используйте
5=солдат с токсическими винтовками, чтобы "убедить" Джейка перейти на сторону Нод.
6=Когда он окажется под нашим влиянием, сопроводите его в точку эвакуации.@@
7=@Избегайте обнаружения силами ГСБ вплоть до момента удара. Если вас заметят,
8=Джейк без промедления отправится в точку эвакуации и попытается сбежать.
9=В таком случае вам придется перехватить Джейка любой ценой.@@
10=Первое задание: Захватите базу ГСБ.@@
11=Второе задание: Возьмите Джейка в плен.@@
12=Третье задание: Проведите Джейка к точке эвакуации.


; Nod Mission 12A
[NOD12A.MAP]
Name=Новое начало
Briefing=NOD12A
VoiceOver=NOD-12A.AUD

[NOD12A]
1=Чтобы наши МБР могли сбить "Филадельфию", они должны установить местоположение
2=станции методом триангуляции. Наши шпионы разместили маяки в самых лучших для
3=развертывания установок МБР позициях. Когда установки окажутся на позициях,
4=станции ГСБ придет конец, а вы сможете начать постройку храма Нод. Не теряйте
5=времени. Если "Филадельфия" пройдет три орбиты, она сможет зафиксировать ваши
6=координаты и уничтожить вас, а вместе с вами погибнут и планы Кэйна.@@
7=Первое задание: Разверните три установки МБР возле маяков.


; Nod Mission 12B
[NOD12B.MAP]
Name=Незаконная передача данных
Briefing=NOD12B
VoiceOver=NOD-12B.AUD

[NOD12B]
1=ГСБ хранят коды управления ионной пушкой в нескольких центрах связи. Они находятся
2=в долине, и охраняют их весьма слабо. В этом регионе у нас нет сил для совершения
3=полномасштабного нападения. Тем не менее в вашем распоряжении будет спецотряд во
4=главе со шпионом-хамелеоном, поэтому шанс на успех у нас есть. Когда шпион достанет
5=коды, позаботьтесь о его эвакуации.@@
6=Первое задание: Проникнете в центр связи и украдите коды.@@
7=Второе задание: Эвакуируйте шпиона-хамелеона.

[TSDEMO.MAP]
Name=Тренировка #1 : Первые шаги
Briefing=TSDEMO
VoiceOver=

Обучающая Миссия 2A
[TSDEMO2.MAP]
Name=Тренировка #2 : Зачистка региона
Briefing=TSDEMO2
VoiceOver=

[TSDEMO]
1=Нам удалось перехватить секретную передачу сил Нод в этом регионе. Все указывает на то,
2=что братство планирует отстроить собственную базу и в скором времени начать нападение на
3=силы ГСБ. Командование приказывает от них избавиться. Используйте вверенные вам
4=подразделения и уничтожьте все силы и постройки Нод.@@
5=Удачи, командир!

[TSDEMO2]
1=Похоже, что мы недооценили сили Нод в этом регионе. Уничтоженная вами база оказалась
2=лишь вспомогательной. Мы обнаружили координаты основного укрепления, и вам предстоит
3=зачистить его для обеспечения безопасности сектора. Предыдущий командир ГСБ заложил
4=фундамент для базы ГСБ, и теперь ее деятельность в ваших руках. Найдите базу Нод и
5=уничтожьте ее, используя любые доступные вам методы.

